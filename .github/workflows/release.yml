name: release

# Un tag {plugin}--v{versión} (el que crea `claude plugin tag`) publica el release
# con los dos zips: la skill para subir a claude.ai y el vault de arranque. Antes
# corren los mismos controles que en el CI: si el saneamiento falla, no hay release.
on:
  push:
    tags: ["*--v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas, consistencia y saneamiento
        env:
          SANITIZE_BLOCKLIST: ${{ secrets.SANITIZE_BLOCKLIST }}
        run: |
          node --test "scripts/*.test.mjs"
          node scripts/check-plugin.mjs
          node scripts/sanitize-check.mjs

      - name: Empaquetar
        run: node scripts/empaquetar.mjs "$GITHUB_REF_NAME"

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file dist/notas.md
